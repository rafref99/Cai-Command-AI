[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cai"
dynamic = ["version"]
description = "Cai: a local-only terminal computer assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["prompt-toolkit>=3.0.48,<4"]
authors = [
  { name = "Cai contributors" }
]
keywords = ["agent", "cli", "terminal-assistant", "local-models", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
cai = "cai.local.cli:main"

[tool.setuptools.packages.find]
include = ["cai*"]

[tool.setuptools.dynamic]
version = { attr = "cai.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["cai", "tests"]
ignore_missing_imports = true
